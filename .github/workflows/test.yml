name: Test

# G14 review-fix - Capa 4 added a large number of tests gated behind
# the requires_docker marker (testcontainers Postgres). Those skip
# on dev boxes without Docker; this workflow runs them on every PR
# against a Linux runner where Docker IS available, closing the gap
# between "green locally" and "actually verified".
#
# Security note: this workflow does NOT consume any github.event.*
# user-controlled input in run: blocks. Pinned actions only
# (checkout@v4, setup-python@v5).

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Settings validates at import time (D-011 / Capa 2 review-fix CR-2):
    # JWT_SECRET >= 32 chars and OAUTH_TOKEN_ENC_KEY decodes to exactly
    # 32 bytes (AES-256-GCM key). pytest collection fails without them.
    # These are TEST-ONLY values, deliberately fixed and obviously fake;
    # they are NOT production secrets. Production values come from the
    # rig's `.env` file (never committed).
    env:
      JWT_SECRET: ci-test-jwt-secret-do-not-use-in-prod-padding-padding
      OAUTH_TOKEN_ENC_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ffmpeg + ffprobe are gated by requires_ffmpeg and Capa 3
      # tests use them via the normalize step. Cheap to install.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # The dev extras include testcontainers, asgi-lifespan, respx,
      # ruff. We DO NOT install the heavy [pipeline] extras
      # (whisperx + pyannote + torch) because the Capa 3 pipeline tests
      # mock those at the loader seam (D-030). Adding them would push
      # the install over GH Actions' default disk budget for no
      # coverage gain.
      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/ tests/

      # requires_docker is run here (Docker is available on the
      # runner; testcontainers spins postgres:16-alpine on demand).
      # We exclude:
      #   - e2e: full pipeline against real audio + GPU
      #   - requires_gpu: tests that need CUDA / MPS
      #   - requires_docker_gpu: hybrid marker (rig only)
      - name: Run test suite
        run: |
          pytest tests/ -q -m "not e2e and not requires_gpu and not requires_docker_gpu"
