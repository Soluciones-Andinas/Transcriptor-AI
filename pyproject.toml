[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transcription-api"
version = "0.1.0"
description = "Self-hosted Spanish transcription + diarization API for Sandinas meetings"
requires-python = ">=3.10,<3.12"
license = { text = "Proprietary" }
authors = [
    { name = "Soluciones Andinas — IA Adoption", email = "ia@sandinas.local" },
]

# Core dependencies — necesarias para que el servicio arranque (incluido auth + DB).
# Las dependencias pesadas del pipeline IA (whisperx, pyannote.audio, torch) están en
# el extra [pipeline] para no inflar el primer build cuando se implementan otras
# capas (auth, UI, MCP server) que no las necesitan.
dependencies = [
    # HTTP framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",

    # Validación + settings
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",

    # Persistencia (Capa 1) — SQLAlchemy 2.0 async + asyncpg + Alembic
    # Decisión arquitectural: ver wiki/ADR/ADR-008.md
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.1.0",  # sync driver, used only by Alembic (ERR-5)
    "alembic>=1.13.0",
    "greenlet>=3.0.0",  # requerido por sqlalchemy async incluso sin uso explícito

    # Auth / Capa 2 — wiki/RF/RF-AUTH.md, wiki/ADR/ADR-009.md
    "authlib>=1.3.0",  # OAuth 2.0 client + JWT + JWKS verification
    "cryptography>=42.0",  # AES-256-GCM for oauth_tokens.ms_*_encrypted (RF-AUTH-02)
    "itsdangerous>=2.2.0",  # signed cookie state for OAuth PKCE flow (RF-AUTH-01)
    "httpx>=0.27.0",  # OAuth /token + JWKS fetch (oauth_client.exchange_code, fetch_jwks)

    # MCP server / Capa 4 — wiki/RF/RF-MCP.md, wiki/ADR/ADR-013
    # Anthropic official Python SDK. Lightweight: no GPU/ML deps, just
    # the JSON-RPC + Streamable-HTTP transport machinery so the FastAPI
    # app can mount the MCP sub-app at /mcp.
    "mcp[server]>=1.5,<2.0",
]

[project.optional-dependencies]
# Pipeline IA (Capa 4 en adelante). Activar con: pip install -e ".[pipeline]"
pipeline = [
    "whisperx>=3.8.5",
    "pyannote.audio>=3.1.0",
    "ffmpeg-python>=0.2.0",
    "torch>=2.1.0",
    "torchaudio>=2.1.0",
]

dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "freezegun>=1.5.0",
    "ruff>=0.7.0",
    # Testing con Postgres real en contenedor efímero
    "testcontainers[postgres]>=4.8.0",
    # Driving startup/shutdown of the ASGI app from async tests (AC-8 + AC-9)
    "asgi-lifespan>=2.1.0",
    # Mock HTTP transport for Capa 2 tests against Microsoft Entra (no real network)
    "respx>=0.21.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
# E501: long lines OK (we already wrap manually).
# N818: typed-exception names like StateInvalid/SessionExpired/TenantNotAllowed
# read more naturally without an "Error" suffix in this codebase.
ignore = ["E501", "N818"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI uses `Depends(...)` / `Header(...)` etc. as default arg values by design.
# Whitelist them so B008 ("Do not perform function call in argument defaults")
# does not fire on canonical FastAPI route signatures.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Header",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Form",
    "fastapi.Cookie",
    "fastapi.File",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# `e2e` tests drive `docker compose` and take 60-90s. Excluded from default
# pytest run; opt in with `pytest -m e2e`.
addopts = "-m 'not e2e'"
markers = [
    "requires_docker: test needs a running Docker daemon (testcontainers).",
    "requires_gpu: test needs a CUDA or MPS accelerator (skip otherwise).",
    "requires_ffmpeg: test needs the ffmpeg/ffprobe binaries on PATH (Capa 3 pipeline).",
    "requires_docker_gpu: test needs both Docker and a GPU (rig-only).",
    "no_engine_override: opt out of tests/conftest.py engine override (AC-7 contract tests).",
    "e2e: end-to-end smoke against `docker compose up` (slow, opt-in).",
]
