[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transcription-api"
version = "0.1.0"
description = "Self-hosted Spanish transcription + diarization API for Sandinas meetings"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = { text = "Proprietary" }
authors = [
    { name = "Soluciones Andinas — IA Adoption", email = "ia@sandinas.local" },
]

# Core dependencies — necesarias para que el servicio arranque (incluido auth + DB).
# Las dependencias pesadas del pipeline IA (whisperx, pyannote.audio, torch) están en
# el extra [pipeline] para no inflar el primer build cuando se implementan otras
# capas (auth, UI, MCP server) que no las necesitan.
dependencies = [
    # HTTP framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",

    # Validación + settings
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",

    # Persistencia (Capa 1) — SQLAlchemy 2.0 async + asyncpg + Alembic
    # Decisión arquitectural: ver wiki/ADR/ADR-008.md
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.1.0",  # sync driver, used only by Alembic (ERR-5)
    "alembic>=1.13.0",
    "greenlet>=3.0.0",  # requerido por sqlalchemy async incluso sin uso explícito
]

[project.optional-dependencies]
# Pipeline IA (Capa 4 en adelante). Activar con: pip install -e ".[pipeline]"
pipeline = [
    "whisperx>=3.8.5",
    "pyannote.audio>=3.1.0",
    "ffmpeg-python>=0.2.0",
    "torch>=2.1.0",
    "torchaudio>=2.1.0",
]

dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "freezegun>=1.5.0",
    "ruff>=0.7.0",
    # Testing con Postgres real en contenedor efímero
    "testcontainers[postgres]>=4.8.0",
    # Driving startup/shutdown of the ASGI app from async tests (AC-8 + AC-9)
    "asgi-lifespan>=2.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# `e2e` tests drive `docker compose` and take 60-90s. Excluded from default
# pytest run; opt in with `pytest -m e2e`.
addopts = "-m 'not e2e'"
markers = [
    "requires_docker: test needs a running Docker daemon (testcontainers).",
    "e2e: end-to-end smoke against `docker compose up` (slow, opt-in).",
]
